services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: agrinex
      POSTGRES_USER: agrinex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports: ["5432:5432"]
    volumes: [agrinex_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U agrinex -d agrinex"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  agrinex_pgdata:
