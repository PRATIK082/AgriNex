name: AgriNex API CI
on:
  push:
    branches: [main, "feat/**", "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: platform/api}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: platform/api/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests
      - run: pytest -q
